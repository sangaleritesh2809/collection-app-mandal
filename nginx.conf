server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    # Serve Privacy Policy directly (Clean URLs)
    location = /privacy {
        try_files /privacy_policy.html =404;
    }

    location = /privacy-policy {
        try_files /privacy_policy.html =404;
    }

    location = /privacy_policy.html {
        try_files /privacy_policy.html =404;
    }

    # Serve Account & Data Deletion directly (Clean URLs for Google Play)
    location = /delete-account {
        try_files /delete_account.html =404;
    }

    location = /delete_account {
        try_files /delete_account.html =404;
    }

    location = /delete_account.html {
        try_files /delete_account.html =404;
    }

    location = /delete-data {
        try_files /delete_account.html =404;
    }

    # Serve Flutter Web SPA routing
    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
